spring.application.name=prm.project-base
server.port=5001

# DATABASE CONFIGURATION
# Active Database: MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA & HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
#spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# FILE UPLOAD CONFIGURATION
file.upload-dir=${UPLOAD_DIR:./upload}
file.base-url=${BASE_URL:http://localhost:5001}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT & CORS CONFIGURATION
# 256-bit (32 bytes) Base64 encoded key with support for dynamic environment variable injection in production
jwt.secret-key=${JWT_SECRET_KEY:c2VjdXJpdHktYmFzZS1wcm9qZWN0LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLXByb2R1Y3Rpb24tZ3JhZGU=}

# https://frontend.prmm.com,https://backend.prm.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# LOGGING CONFIGURATION
logging.file.name=project-base.log
logging.level.root=info
logging.level.prm.projectbase=debug