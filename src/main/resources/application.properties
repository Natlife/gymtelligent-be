spring.application.name=prm.project-base
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:5001}

# ============================================================
#  DATABASE CONFIGURATION
#  ⚠️  All values MUST be set as environment variables in prod.
#  Local dev: create a .env file or set them in your IDE run config.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA & HIBERNATE
# Use 'validate' in production — prevents accidental schema changes.
# Use 'update' only in local dev by setting DB_DDL_AUTO=update via env var.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# FILE UPLOAD
file.upload-dir=${UPLOAD_DIR:./upload}
file.base-url=${BASE_URL:http://localhost:5001}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
#  SECURITY — JWT
#  ⚠️  JWT_SECRET_KEY MUST be set as an environment variable.
#  Generate a strong key: openssl rand -base64 32
# ============================================================
jwt.secret-key=${JWT_SECRET_KEY}

# ============================================================
#  CORS
#  ⚠️  Set CORS_ALLOWED_ORIGINS to your exact frontend domain
#  in production. NEVER use * in production.
#  Example: CORS_ALLOWED_ORIGINS=https://app.gymtelligent.com
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:5001}

# ============================================================
#  LOGGING
#  Use 'warn' or 'error' in production to avoid leaking data.
# ============================================================
ADMIN_SEED_ENABLED=${ADMIN_SEED_ENABLED:false}
logging.file.name=project-base.log
logging.level.root=${LOG_LEVEL_ROOT:warn}
logging.level.prm.projectbase=${LOG_LEVEL_APP:info}
